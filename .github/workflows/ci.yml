name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned quality tools and frontend dependencies
        run: pwsh -NoProfile -File tools/quality/setup.ps1
      - name: Check formatting, linters, dependencies, tests and build
        run: pwsh -NoProfile -File tools/quality/check.ps1 -Fuzz
      - name: Verify committed frontend is current
        run: git diff --exit-code --ignore-space-at-eol -- web/dist
