version: "2"
run:
  timeout: 5m
  # internal/clipboard's test against the real clipboard is behind this tag and
  # no ordinary build compiles it. Analysed here, it cannot stop compiling
  # unnoticed, and what only it uses is not reported as unused.
  build-tags:
    - clipboard_real
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - errorlint
    - nolintlint
  settings:
    staticcheck:
      checks: ["SA*", "S1*"]
    errcheck:
      # Win32 APIs define failure through r1; LazyProc.Call returns last-error even on success.
      exclude-functions:
        - "(*golang.org/x/sys/windows.LazyProc).Call"
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    paths:
      - third_party
      - web/node_modules
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - copynote
  exclusions:
    paths:
      - third_party
      - web/node_modules
